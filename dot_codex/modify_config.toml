#!/usr/bin/env python3
# chezmoi modify script for ~/.codex/config.toml
#
# Manages global settings while preserving machine-local sections
# ([projects.*], [plugins.*], [notice.*]) that Codex writes automatically.
#
# See dot_codex/README.md for background on why this is necessary.

import sys
import tomllib

# --- Managed settings (edit here to change global Codex config) ---
BASE = {
    "model": "gpt-5.5",
    "model_reasoning_effort": "medium",
    "personality": "pragmatic",
    "service_tier": "fast",
    "approval_policy": "never",
    "sandbox_mode": "danger-full-access",
}
# -----------------------------------------------------------------


def fmt(v) -> str:
    if isinstance(v, str):
        return f'"{v}"'
    if isinstance(v, bool):
        return str(v).lower()
    return str(v)


def main() -> None:
    current_text = sys.stdin.read()
    try:
        current = tomllib.loads(current_text)
    except tomllib.TOMLDecodeError:
        current = {}

    lines: list[str] = []

    # Emit managed top-level settings
    for k, v in BASE.items():
        lines.append(f"{k} = {fmt(v)}")

    # Preserve [projects."<path>"] sections written by Codex
    for path, settings in current.get("projects", {}).items():
        lines.append(f'\n[projects."{path}"]')
        for sk, sv in settings.items():
            lines.append(f"{sk} = {fmt(sv)}")

    # Preserve [plugins."<name>"] sections written by Codex
    for name, settings in current.get("plugins", {}).items():
        lines.append(f'\n[plugins."{name}"]')
        for sk, sv in settings.items():
            lines.append(f"{sk} = {fmt(sv)}")

    # Preserve [notice.*] sections (model migration hints written by Codex)
    for key, val in current.get("notice", {}).items():
        lines.append(f"\n[notice.{key}]")
        if isinstance(val, dict):
            for sk, sv in val.items():
                lines.append(f"{sk} = {fmt(sv)}")

    print("\n".join(lines))


main()
