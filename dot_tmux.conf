set-option -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"
set-option -g aggressive-resize on
set-option -g mouse on
set-option -g history-limit 50000

bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

bind-key -T copy-mode    C-c send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi C-c send-keys -X copy-selection-no-clear
